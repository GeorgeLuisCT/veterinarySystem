spring.datasource.url=jdbc:h2:mem:veterinarysystem-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Secreto solo para pruebas (no usar en producción)
jwt.secret=test-secret-key-test-secret-key-test-secret-key-1234567890
jwt.expiration=3600000
